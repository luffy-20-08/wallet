<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Wallet</title>
    <!-- Modern Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page-body">
    <div class="auth-card-modern">
        <div class="auth-card-header">
            <div class="auth-brand-icon">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Log in to manage your financial portfolio</p>
        </div>

        <div id="alert-box" class="alert-clean-danger" style="display: none;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="alert-text"></span>
        </div>

        <form id="login-form">
            <div class="form-group-clean">
                <label for="email" class="form-label-clean">Username or Email</label>
                <input type="text" id="email" class="input-clean" placeholder="e.g. himanshu or name@email.com" required>
            </div>
            <div class="form-group-clean" style="margin-bottom: 20px;">
                <label for="password" class="form-label-clean">Password</label>
                <input type="password" id="password" class="input-clean" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary-purple" id="login-btn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
            </button>
        </form>

        <p class="auth-footer-text">
            Don't have an account? <a href="register.html">Sign Up</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');
        const alertText = document.getElementById('alert-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                await loginUser(email, password);
            } catch (err) {
                alertText.textContent = err.message || 'Login failed';
                alertBox.style.display = 'flex';
            }
        });
    </script>
</body>

</html>
